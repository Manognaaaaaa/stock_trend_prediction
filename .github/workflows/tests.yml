name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Light install: skip torch and the other heavy packages to keep CI fast.
      - name: Install test dependencies
        run: pip install pandas numpy pyarrow pyyaml scikit-learn lightgbm scipy pytest
      - name: Run tests
        run: pytest
